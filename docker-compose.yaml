# Before the first start, once:  ./docker-init.sh      (creates the folders in DATA_LOCATION, owned by the app's user)
# Start:                         docker compose up -d --build
# Then open https://<SCANNER_DOMAIN>/   (ports 80 and 443; the app itself listens only on 127.0.0.1:8000)
# Settings go in a .env file next to this one, see "With Docker" in web_frontend/README.md
services:
  scanner-web:
    build: .
    image: ghcr.io/razvanandreilazar/ocdocumentscanner:latest
    restart: unless-stopped
    init: true    # collects the scanimage processes left behind when one is killed
    depends_on:
      cups:
        condition: service_healthy    # the print server must answer before the app starts

    # for finding scanners on the LAN
    network_mode: host

    # Same owner as the mounted folders, so the files stay yours
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Saving outside the mounts below fails with an error, instead of writing into the container
    # where the scans would be lost with it
    read_only: true
    tmpfs:
      - /tmp:size=512m     # uploads being read, the LibreOffice profile and the printing conversions

    environment:
      WEB_HOST: ${WEB_HOST:-127.0.0.1}    # only the proxy on this machine reaches the app
      WEB_PORT: ${WEB_PORT:-8000}
      WEB_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-*}
      SAVE_ROOT: /app/storage    # save locations are folders inside the mounted one; relative ones are appended to it
      CUPS_SERVER: /run/cups/cups.sock    # the print server, see the cups service

    volumes:
      - ${DATA_LOCATION}/data:/app/data                       # saved printers and settings
      - ${DATA_LOCATION}/scans:/app/storage                   # finished scans: same path inside and out
      - cups-socket:/run/cups                                 # the socket of the print server, and nothing else of it
      - /run/avahi-daemon:/run/avahi-daemon:ro                # the backends find scanners through Avahi
      - /run/dbus:/run/dbus:ro                                # hpaio and Avahi's D-Bus clients
      # HP's own scanner backend (hpaio) needs the plugin that `hp-plugin` installed on the host: the
      # container only has the Debian packages. Without these two, HP devices fail with "Error during
      # device I/O". Long form, so that Compose stops with an error if they are missing here (the short
      # form would create them as root-owned folders). Delete both if you don't use HP's plugin.
      - type: bind
        source: /usr/share/hplip/scan/plugins
        target: /usr/share/hplip/scan/plugins
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/hp/hplip.state
        target: /var/lib/hp/hplip.state
        read_only: true
        bind:
          create_host_path: false

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Prints the files the app uploads. Only its socket is shared with the app (cups-socket): it listens on nothing else.
  cups:
    build: ./cups
    image: ghcr.io/razvanandreilazar/ocdocumentscanner-cups:latest
    restart: unless-stopped
    init: true

    # to reach the printers, and to resolve their .local names through Avahi
    network_mode: host

    environment:
      CUPS_SERVER: /run/cups/cups.sock    # lpstat in the health check talks to the same socket

    # cupsd runs as root and drops to other users for the filters; these are what it needs for that, and no more
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    security_opt:
      - no-new-privileges:true
    # the spool and the cache are queues that are rebuilt on demand, so they don't need to survive a restart
    tmpfs:
      - /var/spool/cups
      - /var/cache/cups
      - /tmp

    volumes:
      - cups-socket:/run/cups
      - /run/avahi-daemon:/run/avahi-daemon:ro
      - /run/dbus:/run/dbus:ro

    healthcheck:
      test: ["CMD", "lpstat", "-r"]     # 'scheduler is running' when the socket answers
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Serves ports 80 and 443 on the host and forwards them to the app, with a Let's Encrypt certificate (see proxy/Caddyfile)
  proxy:
    build: ./proxy
    image: ghcr.io/razvanandreilazar/ocdocumentscanner-proxy:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      - scanner-web
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE    # the only thing it needs: ports 80 and 443
    security_opt:
      - no-new-privileges:true
    environment:
      SCANNER_DOMAIN: ${SCANNER_DOMAIN:?put the DuckDNS name in .env, e.g. SCANNER_DOMAIN=scanner.duckdns.org}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?put the token from duckdns.org in .env as DUCKDNS_TOKEN}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_data:/data        # the certificate: kept, so a recreated container doesn't ask Let's Encrypt again
      - proxy_config:/config
      
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  proxy_data:
  proxy_config:
  cups-socket:      # the CUPS socket, shared by the cups service and scanner-web
