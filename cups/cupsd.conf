# Only the socket in the shared volume is listened to: nothing is open on the network, and nothing
# clashes with a CUPS on the host (see docker-compose.yaml).
Listen /run/cups/cups.sock

Browsing No
WebInterface No
DefaultAuthType None
LogLevel warn
ErrorPolicy retry-job
MaxJobs 50
PreserveJobHistory 1h

# The app runs as another user and must run lpadmin, lp and cancel. That is safe here because only the
# app's container can reach the socket.
<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Policy default>
  <Limit All>
    Order allow,deny
    Allow all
  </Limit>
</Policy>
