name: Tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r web_frontend/requirements.txt
      # the tests parse saved `scanimage --help` output, so no scanner or SANE is needed
      - run: python -m unittest discover -s tests
